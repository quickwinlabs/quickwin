name: CI (Win7 + XP QEMU)

on:
  push:
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────
  # 构建 + 推送开发容器镜像（仅 Dockerfile.dev 变更时重建，
  # 或首次运行镜像不存在时）
  # ──────────────────────────────────────────────────────────
  build-and-push:
    name: build-dev-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Check if image exists
        id: exists
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/xna00/quickwin-dev/manifests/latest")
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ghcr_manifest_status=$code"

      - name: Detect Dockerfile change
        id: detect
        run: |
          changed=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed=true
          elif [ "${{ github.event.before }}" = "${{ github.sha }}" ] || [ -z "${{ github.event.before }}" ]; then
            changed=true
          else
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^docker/Dockerfile.dev$'; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Decide build
        id: need
        run: |
          if [ "${{ steps.exists.outputs.exists }}" != "true" ] || [ "${{ steps.detect.outputs.changed }}" = "true" ]; then
            echo "needs-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs-build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.need.outputs.needs-build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        if: steps.need.outputs.needs-build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        if: steps.need.outputs.needs-build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/
          file: docker/Dockerfile.dev
          push: true
          tags: |
            ghcr.io/xna00/quickwin-dev:latest
            ghcr.io/xna00/quickwin-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify if image skipped
        if: steps.need.outputs.needs-build == 'false'
        run: echo "Dockerfile.dev unchanged, reusing existing ghcr image"

  # ──────────────────────────────────────────────────────────
  # 在开发容器内交叉编译 + QEMU Win7/XP VM 测试（matrix）
  # 镜像即本地环境：Fedora + posix mingw，消除环境差异。
  # win7/xp 差异：win7 用 MINGW64(cc64) 出 qwin.exe 64 位；
  #               xp 用 MINGW32(cc32) 出 qwin-x86.exe 32 位。
  # 测试流程已统一：run.bat 在 VM 内直接跑 test/run.js，
  # host 只需等 run.log 的 Done + 解析 Summary。
  # ──────────────────────────────────────────────────────────
  qemu-test:
    name: qemu-test (${{ matrix.id }})
    needs: build-and-push
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xna00/quickwin-dev:latest
      options: --device /dev/kvm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: win7, cc: x86_64, deps: cc64, nowasm: cc64-nowasm,
              snap_key: win7-ready-v3, snap_file: win7_ready.qcow2, artifact: qwin-x64,
              exe: qwin.exe, nowasm_exe: qwin-nowasm.exe }
          - { id: xp,   cc: i686,   deps: cc32, nowasm: cc32-nowasm,
              snap_key: xp-ready-v3,  snap_file: xp_ready.qcow2,   artifact: qwin-x86,
              exe: qwin-x86.exe, nowasm_exe: qwin-nowasm-x86.exe }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # ── KVM 直通（容器内自带 /dev/kvm，无需 udev 规则）──
      - name: Probe KVM availability
        run: |
          echo "=== /dev/kvm ==="
          ls -l /dev/kvm 2>&1 || echo "NO /dev/kvm"
          [ -w /dev/kvm ] || { echo "::error::KVM not writable in container"; exit 1; }
          echo "=== toolchain (${{ matrix.cc }}) ==="
          ${{ matrix.cc }}-w64-mingw32-gcc -v 2>&1 | grep -i "Thread model" || true
          node --version

      - name: Install npm deps
        run: npm install

      # ── 快照缓存（key 固定 -v1：快照内容不会变，只随安装脚本/流程变化升级）──
      - name: Restore ${{ matrix.id }} snapshot cache
        id: cache-snap
        uses: actions/cache@v5
        with:
          path: docker/snapshots/${{ matrix.snap_file }}
          key: ${{ matrix.snap_key }}

      # ── cache miss：现场安装系统（下载 ISO + 自动应答安装）──
      - name: Install ${{ matrix.id }} (cache miss only)
        id: install-vm
        if: steps.cache-snap.outputs.cache-hit != 'true'
        run: |
          cd docker
          bash setup-${{ matrix.id }}.sh
        timeout-minutes: 40

      - name: Verify snapshot
        run: |
          ls -lh docker/snapshots/
          [ -f docker/snapshots/${{ matrix.snap_file }} ] || \
            { echo "::error::${{ matrix.snap_file }} missing"; exit 1; }

      - name: Cache cross-compile deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            deps/wamr/lib/libiwasm.a
            deps/wolfssl/lib/libwolfssl.a
            deps/wolfssl/build/wolfssl/
            deps/brotli/lib/libbrotlidec.a
            deps/brotli/lib/libbrotlicommon.a
            deps/libffi/lib/libffi.a
            deps/libffi/build-*/include/
          key: deps-${{ matrix.deps }}-${{ hashFiles('Makefile', 'patches/**', 'deps/wamr/**', 'deps/wolfssl/**', 'deps/brotli/**', 'deps/libffi/**') }}-v2

      # cc32 会自动构建 i686 的 libiwasm.a：$(TARGET) 依赖 WAMR_LIB，
      # 且 cc32 把 CC=i686-... 和 WAMR_TARGET=X86_32 传给子 make。
      # 不要单独跑 make wamr —— 不带 CROSS=1 时会用本机 gcc 建错架构的 .a，
      # 之后 cc32 发现 .a "最新"就跳过，链接必挂。
      - name: Cross-compile ${{ matrix.id }} (${{ matrix.deps }})
        run: make ${{ matrix.deps }} BUILD=small
        timeout-minutes: 30

      - name: Cross-compile ${{ matrix.id }} nowasm (${{ matrix.nowasm }})
        run: make ${{ matrix.nowasm }} BUILD=small
        timeout-minutes: 30

      - name: Compile JS + WASM
        run: make js wasm

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            _build/${{ matrix.exe }}
            _build/${{ matrix.nowasm_exe }}
          if-no-files-found: error

      # ── 测试段（win7/xp 统一：host serve_test + VM 内直跑跑完等 Done）──
      - name: Start host test server
        run: |
          node tools/serve_test.ts 18923 > /tmp/serve_test.log 2>&1 &
          echo "serve_test pid=$!"
          sleep 1
          curl -sf http://127.0.0.1:18923/ && echo " <- serve_test up"

      - name: Start ${{ matrix.id }} VM and run tests
        run: |
          cd docker
          SHARE_DIR="$GITHUB_WORKSPACE/_build" bash run.sh ${{ matrix.id }}
        timeout-minutes: 20

      - name: Stop VM
        if: always()
        run: cd docker && bash run.sh ${{ matrix.id }} --stop || true

      - name: Dump VM logs
        if: always()
        run: |
          cat docker/ci_share/run-${{ matrix.id }}.log 2>&1 || true

      - name: Assert test results
        run: |
          LOG=docker/ci_share/run-${{ matrix.id }}.log
          SUMMARY=$(grep -oE "Summary: [0-9]+/[0-9]+" "$LOG" 2>/dev/null | tail -1)
          [ -n "$SUMMARY" ] || { echo "::error::no Summary line in run.log"; exit 1; }
          OK=$(printf '%s' "$SUMMARY" | sed 's/.*: *\([0-9]*\)\/.*/\1/')
          TOTAL=$(printf '%s' "$SUMMARY" | sed 's/.*\/\([0-9]*\).*/\1/')
          FAILED=$(( TOTAL - OK ))
          echo "$SUMMARY  (failed=$FAILED)"
          [ "$FAILED" -le 1 ] || \
            { echo "::error::$FAILED test failures (tolerating 1 for XP printer diff)"; exit 1; }
        timeout-minutes: 5

      - name: Save ${{ matrix.id }} snapshot cache
        if: always() && steps.cache-snap.outputs.cache-hit != 'true' && steps.install-vm.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: docker/snapshots/${{ matrix.snap_file }}
          key: ${{ matrix.snap_key }}

  # ──────────────────────────────────────────────────────────
  # 从 qemu-test job 拿产物发布到 npm（仅 tag push）
  # ──────────────────────────────────────────────────────────
  publish:
    name: npm-publish
    needs: qemu-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install

      - name: Install wabt
        run: sudo apt-get update && sudo apt-get install -y wabt

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qwin-*
          path: _build
          merge-multiple: true

      - name: Verify exes
        run: |
          ls -lh _build/qwin*.exe
          for f in _build/qwin*.exe; do
            file "$f" || true
          done

      - name: Package npm
        run: make npm-pkg

      - name: Configure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Verify package contents
        working-directory: dist/quickwin
        run: npm pack --dry-run

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          TAG="$GITHUB_REF_NAME"
          TAG_VER="${TAG#v}"
          (cd dist/quickwin && npm pack)
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            _build/qwin.exe \
            _build/qwin-x86.exe \
            _build/qwin-nowasm.exe \
            _build/qwin-nowasm-x86.exe \
            _build/main.js \
            "dist/quickwin/quickwin-${TAG_VER}.tgz" \
            --title "$TAG" \
            --notes "QuickWin $TAG — qwin.exe (x64), qwin-x86.exe (x86), qwin-nowasm.exe, qwin-nowasm-x86.exe, main.js, npm tarball"

      - name: Verify npm auth
        run: npm whoami --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}"

      - name: Publish to npm
        working-directory: dist/quickwin
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}"