name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.msystem }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - msystem: UCRT64
            arch: mingw-w64-ucrt-x86_64
          - msystem: MINGW64
            arch: mingw-w64-x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get submodule pin hashes
        id: submodules
        shell: bash
        run: |
          echo "qjs=$(git submodule status quickjs | head -c8)" >> "$GITHUB_OUTPUT"
          echo "wamr=$(git submodule status wamr | head -c8)" >> "$GITHUB_OUTPUT"
          echo "wolfssl=$(git submodule status wolfssl | head -c8)" >> "$GITHUB_OUTPUT"

      - name: Cache exe
        id: cache-exe
        uses: actions/cache@v5
        with:
          path: |
            _build/qwin.exe
            _build/qwin-nowasm.exe
          key: exe-${{ matrix.msystem }}-${{ hashFiles('*.c', '*.h', 'Makefile', 'app.rc') }}-wamr-${{ steps.submodules.outputs.wamr }}-qjs-${{ steps.submodules.outputs.qjs }}-wolfssl-${{ steps.submodules.outputs.wolfssl }}

      - uses: msys2/setup-msys2@v2
        if: steps.cache-exe.outputs.cache-hit != 'true'
        with:
          msystem: ${{ matrix.msystem }}
          release: false
          install: >-
            make
            ${{ matrix.arch }}-gcc
            ${{ matrix.arch }}-cmake
            ${{ matrix.arch }}-brotli
            ${{ matrix.arch }}-libffi

      - name: Build WAMR
        if: steps.cache-exe.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: make wamr

      - name: Build exe
        if: steps.cache-exe.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: make small
        env:
          MSYS2_PREFIX: C:/msys64/${{ matrix.msystem == 'UCRT64' && 'ucrt64' || 'mingw64' }}

      - name: Build nowasm exe
        if: steps.cache-exe.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: make nowasm
        env:
          MSYS2_PREFIX: C:/msys64/${{ matrix.msystem == 'UCRT64' && 'ucrt64' || 'mingw64' }}

      - name: Rename
        shell: bash
        run: |
          cp _build/qwin.exe _build/qwin-${{ matrix.msystem }}.exe
          cp _build/qwin-nowasm.exe _build/qwin-nowasm-${{ matrix.msystem }}.exe

      - uses: actions/upload-artifact@v6
        with:
          name: quickwin-${{ matrix.msystem }}-${{ github.sha }}
          path: |
            _build/qwin-${{ matrix.msystem }}.exe
            _build/qwin-nowasm-${{ matrix.msystem }}.exe

  test:
    name: test
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          registry-url: 'https://registry.npmjs.org'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          install: >-
            make
            mingw-w64-x86_64-nodejs
            mingw-w64-x86_64-wabt

      - uses: actions/download-artifact@v7
        with:
          pattern: quickwin-MINGW64-${{ github.sha }}
          merge-multiple: true

      - name: Place exe
        run: |
          mkdir -p _build
          mv qwin-MINGW64.exe _build/qwin.exe
          mv qwin-nowasm-MINGW64.exe _build/qwin-nowasm.exe

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install npm
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install

      - name: Compile JS + WASM
        run: make js wasm

      - name: Run tests
        run: |
          node --experimental-strip-types tools/serve_test.ts 18923 & SERVER_PID=$!
          _build/qwin.exe _build/test/run.js
          rc=$?
          kill $SERVER_PID 2>/dev/null
          exit $rc

      # ─── publish steps (git tag v*) ───
      # npm 发布需要包名冷却期已过（quickwin 被删除后 24h 内会 403）。
      # GitHub Release 不受影响，即使 npm 步骤失败也已产出。

      - name: Package npm
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: make npm-pkg

      - name: Place exe for publish
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          cp _build/qwin.exe dist/quickwin/qwin.exe
          cp _build/qwin-nowasm.exe dist/quickwin/qwin-nowasm.exe

      - name: Verify version matches tag
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./dist/quickwin/package.json').version")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VER"
            exit 1
          fi
          echo "Release version $PKG_VER"

      - name: Publish npm
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        working-directory: dist/quickwin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Publishing prerelease to dist-tag next"
            npm publish --tag next
          else
            echo "Publishing release to dist-tag latest"
            npm publish --tag latest
          fi

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          TAG="$GITHUB_REF_NAME"
          TAG_VER="${TAG#v}"
          cp _build/qwin.exe qwin.exe
          cp _build/main.js main.js
          (cd dist/quickwin && npm pack)
          gh release create "$TAG" \
            qwin.exe \
            main.js \
            "dist/quickwin/quickwin-${TAG_VER}.tgz" \
            --title "$TAG" \
            --notes "QuickWin $TAG — qwin.exe (MINGW64/MSVCRT, Windows 7+), main.js entry, npm tarball quickwin-$TAG_VER.tgz" \
            --clobber
